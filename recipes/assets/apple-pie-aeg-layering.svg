<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Apple pie assembly cross-section">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="36" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f3a44">Apple Pie Assembly</text>
  <text x="36" y="80" font-family="Arial, sans-serif" font-size="16" fill="#455a64">Build from bottom to top. Keep the top vented so bubbling juices can escape.</text>

  <g transform="translate(70 145)">
    <path d="M20 220 C75 285 405 285 460 220 L430 260 C365 310 115 310 50 260 Z" fill="#d9edf0" stroke="#477b84" stroke-width="4"/>
    <path d="M55 210 C115 250 365 250 425 210 L410 235 C350 270 130 270 70 235 Z" fill="#f3c978" stroke="#8a6d3b" stroke-width="4"/>
    <path d="M90 170 C145 210 335 210 390 170 L425 210 C365 250 115 250 55 210 Z" fill="#d97b42" stroke="#a74922" stroke-width="4"/>
    <ellipse cx="150" cy="185" rx="38" ry="15" fill="#f1c24d"/>
    <ellipse cx="235" cy="178" rx="44" ry="15" fill="#f1c24d"/>
    <ellipse cx="320" cy="188" rx="42" ry="15" fill="#f1c24d"/>
    <path d="M85 148 C145 115 335 115 395 148 L390 170 C335 205 145 205 90 170 Z" fill="#f3c978" stroke="#8a6d3b" stroke-width="4"/>
    <path d="M180 135 h42 M255 132 h42 M300 145 h42" stroke="#7a4d16" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#17202a">
    <g transform="translate(590 145)">
      <circle cx="0" cy="0" r="18" fill="#1f3a44"/><text x="-6" y="7" font-size="20" font-weight="700" fill="#fff">5</text>
      <text x="34" y="6">Top crust, sealed and vented</text>
    </g>
    <g transform="translate(590 200)">
      <circle cx="0" cy="0" r="18" fill="#1f3a44"/><text x="-6" y="7" font-size="20" font-weight="700" fill="#fff">4</text>
      <text x="34" y="6">Apple filling, lightly mounded</text>
    </g>
    <g transform="translate(590 255)">
      <circle cx="0" cy="0" r="18" fill="#1f3a44"/><text x="-6" y="7" font-size="20" font-weight="700" fill="#fff">3</text>
      <text x="34" y="6">Starch and cinnamon mixed through fruit</text>
    </g>
    <g transform="translate(590 310)">
      <circle cx="0" cy="0" r="18" fill="#1f3a44"/><text x="-6" y="7" font-size="20" font-weight="700" fill="#fff">2</text>
      <text x="34" y="6">Bottom crust, chilled and even</text>
    </g>
    <g transform="translate(590 365)">
      <circle cx="0" cy="0" r="18" fill="#1f3a44"/><text x="-6" y="7" font-size="20" font-weight="700" fill="#fff">1</text>
      <text x="34" y="6">20-22 cm pie dish or similar oven dish</text>
    </g>
  </g>

  <rect x="46" y="448" width="808" height="44" rx="8" fill="#f7fafb" stroke="#d5e1e4"/>
  <text x="66" y="476" font-family="Arial, sans-serif" font-size="18" fill="#17202a">Bake on AEG Conventional Cooking, shelf 1, 180 C, until bubbling and deeply golden.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Apple pie tray cross-section">
  <rect width="880" height="360" fill="#ffffff"/>
  <text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1f3a44">Tray Cross-Section</text>
  <text x="34" y="72" font-family="Arial, sans-serif" font-size="16" fill="#455a64">Build both oven trays in this order.</text>

  <g transform="translate(70 118)">
    <path d="M0 120h440l-34 62H34z" fill="#edf4f5" stroke="#477b84" stroke-width="4"/>
    <path d="M48 100h344l-18 32H66z" fill="#f3c978" stroke="#b88926" stroke-width="3"/>
    <path d="M72 78h296l-12 22H84z" fill="#d9b46a" stroke="#9a7228" stroke-width="2"/>
    <path d="M88 30h264l16 48H72z" fill="#d97942" stroke="#a74922" stroke-width="2"/>
    <ellipse cx="130" cy="55" rx="28" ry="12" fill="#f1c24d"/>
    <ellipse cx="206" cy="48" rx="34" ry="13" fill="#f1c24d"/>
    <ellipse cx="286" cy="58" rx="36" ry="14" fill="#f1c24d"/>
    <path d="M76 18h288l-12 16H88z" fill="#f3c978" stroke="#b88926" stroke-width="3"/>
    <path d="M150 22h38M224 22h38M298 22h38" stroke="#8b5e24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#17202a" stroke="#455a64" stroke-width="2">
    <line x1="530" y1="139" x2="440" y2="139"/>
    <text x="548" y="145" stroke="none">Top dough with steam vents</text>
    <line x1="530" y1="174" x2="432" y2="174"/>
    <text x="548" y="180" stroke="none">Apple filling</text>
    <line x1="530" y1="210" x2="420" y2="210"/>
    <text x="548" y="216" stroke="none">Crumbs or semolina</text>
    <line x1="530" y1="246" x2="410" y2="246"/>
    <text x="548" y="252" stroke="none">Bottom dough</text>
    <line x1="530" y1="288" x2="392" y2="288"/>
    <text x="548" y="294" stroke="none">Lined oven tray</text>
  </g>

  <g transform="translate(78 312)" font-family="Arial, sans-serif" font-size="17" fill="#263238">
    <text x="0" y="0">Order: base -> crumbs -> apples -> top -> vents -> egg wash</text>
  </g>
</svg>

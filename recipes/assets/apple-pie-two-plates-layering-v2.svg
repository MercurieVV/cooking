  <rect x="165" y="398" width="770" height="50" rx="6" fill="#f3c978" stroke="#9a7228" stroke-width="4"/>
  <rect x="180" y="356" width="740" height="38" rx="6" fill="#d9b46a" stroke="#8c6829" stroke-width="4"/>
  <rect x="190" y="262" width="720" height="90" rx="8" fill="#d97942" stroke="#a74922" stroke-width="4"/>
  <g fill="#f1c24d" stroke="#9a7228" stroke-width="3">
    <ellipse cx="260" cy="304" rx="44" ry="18"/>
    <ellipse cx="380" cy="292" rx="52" ry="20"/>
    <ellipse cx="520" cy="310" rx="56" ry="22"/>
    <ellipse cx="660" cy="292" rx="50" ry="19"/>
    <ellipse cx="790" cy="310" rx="46" ry="18"/>
  </g>
  <rect x="175" y="208" width="750" height="46" rx="6" fill="#f3c978" stroke="#9a7228" stroke-width="4"/>

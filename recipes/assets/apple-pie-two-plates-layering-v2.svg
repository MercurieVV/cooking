    <path d="M310 230h70"/>
    <path d="M500 230h70"/>
    <path d="M690 230h70"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#15323a">
    <circle cx="88" cy="475" r="31" fill="#2f6f7a"/>
    <text x="88" y="485" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="552">Lined oven tray</text>

    <circle cx="88" cy="422" r="31" fill="#2f6f7a"/>
    <text x="88" y="432" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
    <text x="210" y="430">Bottom dough</text>

    <circle cx="88" cy="374" r="31" fill="#2f6f7a"/>
    <text x="88" y="384" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
    <text x="220" y="383">Breadcrumbs</text>

    <circle cx="88" cy="304" r="31" fill="#2f6f7a"/>

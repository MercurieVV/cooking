<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Apple pie tray cross-section, build order 1 to 5" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="40" y="56" font-size="38" font-weight="700" fill="#12303a">Tray cross-section — build order</text>
  <text x="40" y="94" font-size="24" fill="#4a5c61">Same for both trays. Numbers are the order you add each layer.</text>

  <g transform="translate(60 150) scale(1.35)">
    <path d="M0 120h440l-34 62H34z" fill="#edf4f5" stroke="#2f6f7a" stroke-width="4"/>
    <path d="M48 100h344l-18 32H66z" fill="#f3c978" stroke="#a3651f" stroke-width="3.5"/>
    <path d="M72 78h296l-12 22H84z" fill="#d9b46a" stroke="#8a6626" stroke-width="3"/>
    <path d="M88 30h264l16 48H72z" fill="#d97942" stroke="#a74922" stroke-width="3"/>
    <ellipse cx="130" cy="55" rx="28" ry="12" fill="#f1c24d"/>
    <ellipse cx="206" cy="48" rx="34" ry="13" fill="#f1c24d"/>
    <ellipse cx="286" cy="58" rx="36" ry="14" fill="#f1c24d"/>
    <path d="M76 18h288l-12 16H88z" fill="#f3c978" stroke="#a3651f" stroke-width="3.5"/>
    <path d="M150 22h38M224 22h38M298 22h38" stroke="#7a4d16" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g stroke="#7b8b8f" stroke-width="2.5">
    <line x1="700" y1="188" x2="640" y2="188"/>
    <line x1="700" y1="243" x2="628" y2="243"/>
    <line x1="700" y1="290" x2="612" y2="290"/>
    <line x1="700" y1="340" x2="596" y2="340"/>
    <line x1="700" y1="400" x2="572" y2="400"/>
  </g>

  <g font-size="27" fill="#17202a">
    <g transform="translate(712 188)">
      <circle cx="0" cy="-8" r="18" fill="#12303a"/><text x="-8" y="1" font-size="22" font-weight="700" fill="#fff">5</text>
      <text x="30" y="2">Top dough + steam vents</text>
    </g>
    <g transform="translate(712 243)">
      <circle cx="0" cy="-8" r="18" fill="#12303a"/><text x="-8" y="1" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="30" y="2">Apple filling, 2 cm deep</text>
    </g>
    <g transform="translate(712 290)">
      <circle cx="0" cy="-8" r="18" fill="#12303a"/><text x="-8" y="1" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="30" y="2">Breadcrumbs or semolina</text>
    </g>
    <g transform="translate(712 340)">
      <circle cx="0" cy="-8" r="18" fill="#12303a"/><text x="-8" y="1" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="30" y="2">Bottom dough, 4-5 mm</text>
    </g>
    <g transform="translate(712 400)">
      <circle cx="0" cy="-8" r="18" fill="#12303a"/><text x="-8" y="1" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="30" y="2">Tray lined with paper</text>
    </g>
  </g>

  <g transform="translate(60 545)">
    <rect x="-14" y="-34" width="1000" height="52" rx="10" fill="#f6fafb" stroke="#cfdde0" stroke-width="2"/>
    <text x="8" y="0" font-size="26" fill="#17202a">Finish: brush egg wash over the top dough, then scatter coarse sugar.</text>
  </g>
</svg>

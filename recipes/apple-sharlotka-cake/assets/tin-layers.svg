<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="34" font-weight="700" fill="#1a1a1a">Cake tin cross-section</text>

  <!-- Tin outline -->
  <path d="M140 130 L140 400 Q140 440 180 440 L740 440 Q780 440 780 400 L780 130"
        fill="none" stroke="#555555" stroke-width="4"/>

  <!-- Layer 1: batter -->
  <rect x="144" y="345" width="632" height="90" fill="#f2d98a" stroke="#b8923f" stroke-width="2.5"/>

  <!-- Layer 2: apple wedges -->
  <g stroke="#8a4a1e" stroke-width="2.5" fill="#e08a3c">
    <path d="M160 345 L215 290 L255 345 Z"/>
    <path d="M255 345 L310 282 L350 345 Z"/>
    <path d="M350 345 L405 295 L445 345 Z"/>
    <path d="M445 345 L500 285 L540 345 Z"/>
    <path d="M540 345 L595 290 L635 345 Z"/>
    <path d="M635 345 L690 282 L730 345 Z"/>
    <path d="M730 345 L770 295 L780 345 Z"/>
  </g>

  <!-- Layer 3: sugar + cinnamon dusting -->
  <g fill="#c98a2e">
    <circle cx="185" cy="275" r="4"/>
    <circle cx="235" cy="262" r="4"/>
    <circle cx="285" cy="270" r="4"/>
    <circle cx="335" cy="258" r="4"/>
    <circle cx="385" cy="270" r="4"/>
    <circle cx="435" cy="260" r="4"/>
    <circle cx="485" cy="270" r="4"/>
    <circle cx="535" cy="258" r="4"/>
    <circle cx="585" cy="270" r="4"/>
    <circle cx="635" cy="260" r="4"/>
    <circle cx="685" cy="270" r="4"/>
    <circle cx="730" cy="260" r="4"/>
  </g>

  <!-- Callout lines + labels, stacked below -->
  <line x1="780" y1="390" x2="860" y2="390" stroke="#555555" stroke-width="2"/>
  <text x="40" y="480" font-size="28" fill="#1a1a1a">1  Batter — poured level, entire batch</text>

  <line x1="780" y1="315" x2="860" y2="315" stroke="#555555" stroke-width="2"/>
  <text x="40" y="510" font-size="28" fill="#1a1a1a">2  Apples — thick, dense layer, not stirred in</text>

  <line x1="780" y1="265" x2="860" y2="265" stroke="#555555" stroke-width="2"/>
  <text x="40" y="540" font-size="28" fill="#1a1a1a">3  Sugar + cinnamon — dusted on top</text>
</svg>
